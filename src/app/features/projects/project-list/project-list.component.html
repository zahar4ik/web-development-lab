<div class="list-container">
  <h2>Our Projects</h2>

  <div class="filter-section">
    <input 
      #searchInput
      type="text" 
      placeholder="Пошук за назвою..." 
      [(ngModel)]="searchQuery" 
      (ngModelChange)="filterItems()"
      class="search-input"
    >

    <select 
      [(ngModel)]="selectedStatus" 
      (ngModelChange)="filterItems()" 
      class="status-select"
    >
      <option value="All">Усі статуси</option>
      @for (status of statusOptions; track status) {
        <option [value]="status">{{ status }}</option>
      }
    </select>

    <button class="btn-reset" (click)="resetFilters(searchInput)">
      Очистити
    </button>
  </div>
  
  <p class="results-count">Знайдено: {{ filteredProjects.length }}</p>

  <div class="projects-grid">
    @for (item of filteredProjects; track item.id) {
      <web-card [project]="item" (addToCart)="handleCardAction($event)"></web-card>
    } @empty {
      <p class="no-data">Нічого не знайдено.</p>
    }
  </div>
</div>
